name: Build DartNative app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: write-all

env:
  DART_NATIVE_LICENSE_TOKEN: ${{ secrets.DART_NATIVE_LICENSE_TOKEN }}

jobs:
  discover:
    name: Discover Android apps
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find buildable apps
        id: targets
        shell: bash
        run: |
          candidates=(
            playground
            starter
            tutorials/*
            plugins/*/example
            third_party_plugin
            third_party_plugin/*/example
          )
          targets=()

          for path in "${candidates[@]}"; do
            if [[ -f "$path/pubspec.yaml" && -d "$path/android" ]]; then
              name="$(sed -nE "s/^name:[[:space:]]*[\"']?([^\"']+)[\"']?[[:space:]]*$/\1/p" "$path/pubspec.yaml" | head -n 1)"
              if [[ -z "$name" ]]; then
                echo "Could not read pubspec name from $path/pubspec.yaml" >&2
                exit 1
              fi
              targets+=("$(jq -nc --arg target "$path" --arg name "$name" '{target: $target, name: $name}')")
            fi
          done

          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No Android DartNative apps were found." >&2
            exit 1
          fi

          printf 'targets=%s\n' "$(printf '%s\n' "${targets[@]}" | jq -sc '.')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install DartNative CLI
        shell: bash
        run: |
          curl -fsSL https://cdn.dartnative.com/install.sh | sh
          echo "$HOME/zero/bin" >> "$GITHUB_PATH"

      - name: Verify DartNative CLI
        run: dn --version

      - name: Precache DartNative SDK artifacts
        run: dn precache --force --universal

      - name: Resolve dependencies
        working-directory: ${{ matrix.app.target }}
        run: dn pub get

      - name: Build release APK
        working-directory: ${{ matrix.app.target }}
        shell: bash
        run: dn build apk --release --dart-define=DART_NATIVE_LICENSE_TOKEN="$DART_NATIVE_LICENSE_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app.name }}
          path: ${{ matrix.app.target }}/build/**/outputs/**/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release-artifacts

      - name: Push into Releases Tab
        uses: ncipollo/release-action@v1
        with:
          artifacts: release-artifacts/**/*.apk
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
